    <header class="review-bar" aria-label="Prototype review controls">
      <details>
        <summary><strong>Mock wedding · controls</strong><span id="review-selection"></span></summary>

          <button type="button" id="reset-button">Reset this case</button>
        </form>
        <div id="review-scenario"></div>
      </details>
